name: Build A256E KernelSU SusFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 zip unzip cpio lz4 wget device-tree-compiler dwarves

      - name: Setup Clang r416183b & Magiskboot
        run: |
          mkdir -p $HOME/toolchain/clang-r416183b
          cd $HOME/toolchain/clang-r416183b
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz || \
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r416183b.tar.gz || \
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r416183b.tar.gz
          tar -xzf clang-r416183b.tar.gz && rm clang-r416183b.tar.gz

          mkdir -p $HOME/tools && cd $HOME/tools
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk -O magisk.zip
          unzip -p magisk.zip lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

      - name: Download Kernel Source and Inspect Stock Images
        run: |
          mkdir -p $HOME/work && cd $HOME/work
          wget https://github.com/habibsaba2-dot/A256E-KERNELSU/releases/download/v1.0/Kernel.tar.gz
          wget https://github.com/habibsaba2-dot/A256E-KERNELSU/releases/download/v1.0/boot.img.lz4
          wget -q https://github.com/habibsaba2-dot/A256E-KERNELSU/releases/download/v1.0/init_boot.img.lz4 || true
          tar -xzf Kernel.tar.gz
          lz4 -d boot.img.lz4 boot.img
          if [ -f init_boot.img.lz4 ]; then
            lz4 -d init_boot.img.lz4 init_boot.img
            echo "HAS_INIT_BOOT=1" >> $GITHUB_ENV
          else
            echo "HAS_INIT_BOOT=0" >> $GITHUB_ENV
          fi

          mkdir -p $HOME/work/stock_unpack && cd $HOME/work/stock_unpack
          cp $HOME/work/boot.img .
          $HOME/tools/magiskboot unpack boot.img
          STOCK_VERMAGIC=$(strings kernel | grep -m1 "vermagic=" | sed 's/^vermagic=//')
          STOCK_VER=$(echo "$STOCK_VERMAGIC" | awk '{print $1}')
          if [ -z "$STOCK_VER" ]; then
            STOCK_VER=$(strings kernel | grep -m1 "Linux version " | awk '{print $3}')
          fi
          STOCK_LOCALVER=$(echo "$STOCK_VER" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')
          echo "Stock Kernel vermagic: $STOCK_VERMAGIC"
          echo "Extracted Stock LOCALVERSION: $STOCK_LOCALVER"
          echo "STOCK_LOCALVER=$STOCK_LOCALVER" >> $GITHUB_ENV

          DEFCONFIG_PATH=$(find $HOME/work -name "s5e8825-a25xxx_defconfig" | head -n 1)
          KERNEL_DIR=$(cd "$(dirname "$DEFCONFIG_PATH")/../../.." && pwd)
          echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV

      - name: Integrate KernelSU-Next, SusFS (5.10), and Module CRC Compatibility
        run: |
          chmod -R u+w "$KERNEL_DIR"
          cd "$KERNEL_DIR"
          touch .scmversion
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git $HOME/susfs4ksu
          cp -r $HOME/susfs4ksu/kernel_patches/fs/* fs/
          cp -r $HOME/susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 --fuzz=4 --no-backup-if-mismatch < $HOME/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || true

          python3 - << 'EOF'
          import os, re, glob

          ns_file = "fs/namespace.c"
          ns_rej = "fs/namespace.c.rej"
          if os.path.exists(ns_file):
              os.chmod(ns_file, 0o644)
              with open(ns_file, "r") as f:
                  content = f.read()

              header_target = "unsigned int sysctl_mount_max"
              header_inject = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "extern bool susfs_is_current_ksu_domain(void);\n"
                  "extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n"
                  "#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n"
                  "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n"
              )
              if "CL_COPY_MNT_NS BIT(25)" not in content and header_target in content:
                  content = content.replace(header_target, header_inject + header_target, 1)
                  print("Auto-patched header definitions in fs/namespace.c")

              if "copy_flags |= CL_COPY_MNT_NS;" not in content:
                  pattern = r'(copy_flags\s*\|=\s*CL_SHARED_TO_SLAVE;)'
                  replacement = (
                      r'\1\n'
                      r'#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                      r'\tcopy_flags |= CL_COPY_MNT_NS;\n'
                      r'#endif'
                  )
                  new_content, count = re.subn(pattern, replacement, content, count=1)
                  if count > 0:
                      content = new_content
                      print("Auto-patched copy_mnt_ns in fs/namespace.c")

              with open(ns_file, "w") as f:
                  f.write(content)

              if (
                  "CL_COPY_MNT_NS BIT(25)" in content
                  and "copy_flags |= CL_COPY_MNT_NS;" in content
                  and os.path.exists(ns_rej)
              ):
                  os.remove(ns_rej)
                  print("Removed resolved fs/namespace.c.rej")

          for mod_file in ["kernel/module.c", "kernel/module/version.c"]:
              if os.path.exists(mod_file):
                  os.chmod(mod_file, 0o644)
                  with open(mod_file, "r") as f:
                      mcontent = f.read()
                  m = re.search(r'static\s+int\s+check_version\s*\([^;]*?\)\s*\{', mcontent, flags=re.DOTALL)
                  if m:
                      idx = m.start()
                      end_idx = mcontent.find("\n}", idx)
                      if end_idx != -1:
                          func_body = mcontent[idx:end_idx]
                          if "return 0;" in func_body:
                              func_body = func_body.replace("return 0;", "return 1;")
                              mcontent = mcontent[:idx] + func_body + mcontent[end_idx:]
                              with open(mod_file, "w") as f:
                                  f.write(mcontent)
                              print(f"Patched check_version return value in {mod_file}")

          rejs = sorted(glob.glob("**/*.rej", recursive=True))
          if rejs:
              print("=== REMAINING SUSFS PATCH REJECTS ===")
              for r in rejs:
                  print(f"\n--- REJECT FILE: {r} ---")
                  with open(r, "r") as f:
                      print(f.read())
              raise SystemExit(1)
          print("=== ALL SUSFS PATCHES APPLIED CLEANLY ===")
          EOF

      - name: Configure Defconfig and Disable Exynos RKP/KDP Protections
        run: |
          DEFCONFIG="$KERNEL_DIR/arch/arm64/configs/s5e8825-a25xxx_defconfig"
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG

          sed -i 's/CONFIG_SECURITY_DEFEX=y/# CONFIG_SECURITY_DEFEX is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_PROCA=y/# CONFIG_PROCA is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_FIVE=y/# CONFIG_FIVE is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_SECURITY_DSMS=y/# CONFIG_SECURITY_DSMS is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_RKP=y/# CONFIG_RKP is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_UH_RKP=y/# CONFIG_UH_RKP is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_UH_LKMAUTH=y/# CONFIG_UH_LKMAUTH is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_KDP=y/# CONFIG_KDP is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_KDP_CRED=y/# CONFIG_KDP_CRED is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_KDP_NS=y/# CONFIG_KDP_NS is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/g' $DEFCONFIG

          sed -i '/^CONFIG_LOCALVERSION=/d' $DEFCONFIG
          sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' $DEFCONFIG
          echo "CONFIG_LOCALVERSION=\"$STOCK_LOCALVER\"" >> $DEFCONFIG
          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> $DEFCONFIG

      - name: Compile A25 Kernel
        run: |
          set -o pipefail
          export PATH="$HOME/toolchain/clang-r416183b/bin:$PATH"
          export PLATFORM_VERSION=12
          export ANDROID_MAJOR_VERSION=s
          export TARGET_SOC=s5e8825
          export LLVM=1
          export LLVM_IAS=1
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export DEPMOD=depmod
          export DTC_FLAGS="-@"

          cd "$KERNEL_DIR"
          make O=out LOCALVERSION="$STOCK_LOCALVER" s5e8825-a25xxx_defconfig
          make O=out LOCALVERSION="$STOCK_LOCALVER" -j$(nproc) 2>&1 | tee /tmp/a25_build.log || {
            echo "=== COMPILER ERROR SUMMARY ==="
            grep -iE "error:|fatal error:" /tmp/a25_build.log | tail -n 25
            exit 1
          }
          echo "Compiled Kernel vermagic: $(strings out/vmlinux | grep -m1 'vermagic=' | sed 's/^vermagic=//')"

      - name: Repack boot.img and Create Odin Tar
        run: |
          mkdir -p /home/runner/output && cd /home/runner/output
          cp $HOME/work/boot.img .
          $HOME/tools/magiskboot unpack boot.img
          cp "$KERNEL_DIR/out/arch/arm64/boot/Image" kernel
          $HOME/tools/magiskboot repack boot.img new-boot.img
          mv new-boot.img boot.img
          if [ "$HAS_INIT_BOOT" = "1" ]; then
            cp $HOME/work/init_boot.img .
            tar -cvf A256E_KSU_SusFS_boot.tar boot.img init_boot.img
          else
            tar -cvf A256E_KSU_SusFS_boot.tar boot.img
          fi

      - name: Upload Ready Odin Package
        uses: actions/upload-artifact@v4
        with:
          name: A256E-KSU-SusFS-Odin
          path: /home/runner/output/A256E_KSU_SusFS_boot.tar
